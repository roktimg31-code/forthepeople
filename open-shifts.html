<title>Open Shifts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Figtree:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: black and white only. A six-scene story on black (white type, white line drawings), then a white site with black line drawings. Register page has a looping line animation of faceless figures helping each other behind two big choices. No accent colour; green and red only show state. */
:root {
  --bg: #fbf6ec; --fg: #1b1a17; --muted: #6b6558; --line: #e0d5bf; --soft: #f2ead8;
  --ok: #2f7d5b; --warn: #b3261e; --intro-bg: #f2b632; --intro-fg: #1b1a17; --focus: #1b1a17;
  --accent: #c8431f; --c2: #e8a317; --c3: #2f7d5b; --c4: #2f4ea2; --c5: #d9577a;
  --font-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14120f; --fg: #f6efe0; --muted: #a69f90; --line: #332e25; --soft: #1e1b16;
    --ok: #5fc296; --warn: #ff8a80; --focus: #f6efe0; --accent: #ff8a5c; --c2: #f5bd3f; --c3: #5fc296; --c4: #8aa3ff; --c5: #f08aa8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14120f; --fg: #f6efe0; --muted: #a69f90; --line: #332e25; --soft: #1e1b16;
  --ok: #5fc296; --warn: #ff8a80; --focus: #f6efe0; --accent: #ff8a5c; --c2: #f5bd3f; --c3: #5fc296; --c4: #8aa3ff; --c5: #f08aa8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.shell { max-width: 980px; margin: 0 auto; }


/* illustrations: own drawings, ink + one accent */
.ill { width: 100%; height: auto; display: block; --ink: var(--fg); --paper: var(--bg); }
#intro .ill { --ink: #1c1612; --paper: var(--intro-bg); --accent: #ff5a36; --c2: #fffaf0; --c3: #1fa86f; --c4: #2f6fe0; --c5: #e0528a; }
.ill .in, .ill .sk { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
.ill .sk2 { fill: none; stroke: var(--paper); stroke-linecap: round; stroke-linejoin: round; }
.ill .fi { fill: var(--ink); stroke: none; }
.ill .pa { fill: var(--paper); stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.ill .ac { fill: var(--accent); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.ill .acs { fill: none; stroke: var(--accent); stroke-linecap: round; }
.ill .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ill .sa { fill: none; stroke: var(--paper); stroke-width: 1.6; }
.ill .bob { animation: bob 3.6s ease-in-out infinite; } .ill .b2 { animation-delay: -1.2s; } .ill .b3 { animation-delay: -2.4s; }
.ill .dog { animation: bob 2.4s ease-in-out infinite; } .ill .wag { transform-box: fill-box; transform-origin: 0 100%; animation: wag .5s ease-in-out infinite alternate; }
.ill .steam path { animation: steam 2.6s ease-in-out infinite; } .ill .drip { animation: drip 1.7s linear infinite; }
.ill .grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 4s ease-in-out infinite alternate; }
.ill .twinkle, .ill .winlit { animation: twk 3.4s ease-in-out infinite; }
.ill .pass { animation: pass 3.4s ease-in-out infinite; } .ill .litter { animation: twk 3s ease-in-out infinite; }
.ill .sunr { transform-box: fill-box; transform-origin: 50% 50%; animation: sunr 7s ease-in-out infinite alternate; }
.ill .bridge { stroke-dasharray: 1; animation: brg 4.5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes wag { to { transform: rotate(14deg); } }
@keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
@keyframes drip { 0% { opacity: 0; transform: translateY(-4px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(8px); } }
@keyframes grow { from { transform: scaleY(.92); } to { transform: scaleY(1.04); } }
@keyframes twk { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes pass { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-14px); } }
@keyframes sunr { to { transform: scale(1.05); } }
@keyframes brg { 0% { stroke-dashoffset: 1; } 60%,100% { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .ill * { animation: none !important; } }
/* avatar, header chip */
.av { display: inline-grid; place-items: center; border: 1.5px solid var(--fg); border-radius: 50%; font-weight: 600; background: var(--bg); color: var(--fg); flex: none; line-height: 1; }
.av svg { width: 56%; height: 56%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav a.me-chip { display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 2px 0; color: var(--fg); }
.nav a.me-chip[aria-current="page"] .av { background: var(--fg); color: var(--bg); }
.av-pick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.av-pick button { width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; display: grid; place-items: center; }
.av-pick button[aria-pressed="true"] { border: 2px solid var(--fg); background: var(--soft); }
.av-pick svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* welcome + dashboard */
.wel { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 28px 8px; }
.wel h1, .dash-h h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 600; letter-spacing: -.04em; line-height: 1.02; }
.wel p.lead { margin-top: 12px; color: var(--muted); max-width: 40ch; }
.wel .art { min-width: 0; } .wel .art, .wel .pic { border: 0 !important; background: none !important; padding: 0 !important; }
.dash-h .stats { display: flex !important; gap: 22px; border: 0 !important; flex-wrap: wrap; } .dash-h .stats > div { border: 0 !important; padding: 0 !important; }
.card { border: 1px solid var(--fg); padding: 16px 18px; display: grid; gap: 8px; margin-top: 22px; }
.card h2 { font-size: 1rem; font-weight: 600; }
.steps { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 10px; counter-reset: st; }
.steps li { display: flex; gap: 12px; align-items: flex-start; counter-increment: st; }
.steps li::before { content: counter(st); width: 24px; height: 24px; border: 1px solid var(--fg); border-radius: 50%; display: grid; place-items: center; font-size: .8rem; flex: none; font-family: var(--font-mono); }
.steps li.done::before { content: "\2713"; background: var(--fg); color: var(--bg); }
.steps li span { min-width: 0; }
.dash-h { padding-block: 26px 4px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.dash-h p { color: var(--muted); margin-top: 6px; }
.go-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
.gocard { border: 1px solid var(--fg); padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.gocard h2 { font-size: 1.4rem; letter-spacing: -.03em; font-weight: 600; }
.gocard p { color: var(--muted); font-size: .95rem; }
.gocard .ill { max-height: 150px; }
.gocard .btn { justify-self: start; }
.next { border: 1px solid var(--line); background: var(--soft); padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
.cat-grid, .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
.cat, .tpl { border: 1px solid var(--line); background: var(--bg); padding: 8px 8px 10px; text-align: left; cursor: pointer; display: grid; gap: 6px; min-width: 0; color: var(--fg); }
.cat:hover, .tpl:hover { border-color: var(--fg); }
.cat b, .tpl b { font-size: .95rem; font-weight: 600; } .cat span, .tpl span { color: var(--muted); font-size: .82rem; }
.tips { margin: 10px 0 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; font-size: .92rem; }
@media (max-width: 720px) { .wel, .go-grid { grid-template-columns: 1fr; } .wel .art { order: -1; max-width: 340px; } }


.ill .ac:nth-child(3n+2) { fill: var(--c2); } .ill .ac:nth-child(3n) { fill: var(--c4); } .ill .ac:nth-child(5n+4) { fill: var(--c3); } .ill .ac:nth-child(7n) { fill: var(--c5); }
.ill .acs:nth-child(2n) { stroke: var(--c4); }
#intro { transition: opacity .5s, background-color .7s ease; }
.nav a.cta { background: var(--accent); color: #fff; }
.gocard:nth-child(1), .cat:nth-child(6n+1), .tpl:nth-child(6n+1) { background: color-mix(in srgb, var(--c2) 24%, var(--bg)); }
.gocard:nth-child(2), .cat:nth-child(6n+2), .tpl:nth-child(6n+2) { background: color-mix(in srgb, var(--c3) 20%, var(--bg)); }
.cat:nth-child(6n+3), .tpl:nth-child(6n+3) { background: color-mix(in srgb, var(--c4) 18%, var(--bg)); }
.cat:nth-child(6n+4), .tpl:nth-child(6n+4) { background: color-mix(in srgb, var(--accent) 16%, var(--bg)); }
.cat:nth-child(6n+5), .tpl:nth-child(6n+5) { background: color-mix(in srgb, var(--c5) 18%, var(--bg)); }
.cat:nth-child(6n), .tpl:nth-child(6n) { background: color-mix(in srgb, var(--c2) 24%, var(--bg)); }
.dash-h .stats b { color: var(--accent); }
.next { background: color-mix(in srgb, var(--c4) 14%, var(--bg)); border-color: var(--c4); }
.card { box-shadow: 4px 4px 0 var(--c2); }
.av { background: color-mix(in srgb, var(--c2) 40%, var(--bg)); }

/* story */
#intro { position: fixed; inset: 0; z-index: 100; background: var(--intro-bg); color: var(--intro-fg); display: flex; flex-direction: column; padding: 0 max(24px, env(safe-area-inset-left, 0px)); padding-top: env(safe-area-inset-top, 0px); transition: opacity .5s ease; overflow-y: auto; }
#intro.leave { opacity: 0; pointer-events: none; }
.i-top { max-width: 1000px; width: 100%; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding-block: 16px; }
.i-mark { font-weight: 700; letter-spacing: -.02em; }
.i-skip { background: none; border: 0; color: var(--intro-fg); opacity: .65; cursor: pointer; padding: 10px 0; font-size: .9rem; text-decoration: underline; text-underline-offset: 3px; }
.i-skip:hover { opacity: 1; }
.i-stage { flex: 1; display: flex; align-items: center; max-width: 1000px; width: 100%; margin: 0 auto; }
.sc { width: 100%; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 36px; align-items: center; padding-block: 12px; }
.sc .kick { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; opacity: .7; animation: rise .6s ease both; }
.sc h1 { margin-top: 12px; font-size: clamp(2.1rem, 6.4vw, 3.9rem); font-weight: 600; letter-spacing: -.04em; line-height: 1; animation: reveal .9s cubic-bezier(.2,.7,.2,1) both; }
.sc.big h1 { font-size: clamp(3rem, 9.5vw, 6rem); letter-spacing: -.06em; line-height: .9; }
.sc .lead { margin-top: 18px; font-size: clamp(1.05rem, 2.6vw, 1.35rem); max-width: 34ch; opacity: 0; animation: rise .8s ease forwards; animation-delay: var(--d, .5s); }
.sc ul { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 12px; max-width: 44ch; }
.sc li { font-size: clamp(1rem, 2.4vw, 1.2rem); padding-left: 22px; position: relative; opacity: 0; animation: rise .7s ease forwards; animation-delay: var(--d); }
.sc li::before { content: ""; position: absolute; left: 0; top: .62em; width: 10px; height: 1px; background: var(--intro-fg); }
.sc .art svg { width: 100%; height: auto; color: var(--intro-fg); }
.sc .art { min-width: 0; }
.pic { position: relative; display: block; }
.pic .ill { max-height: min(56vh, 420px); }

.pic.gocard .ill { --p: 0; --ang: 100deg; -webkit-mask-image: linear-gradient(var(--ang), #000 calc(var(--p) * 1% - 14%), transparent calc(var(--p) * 1%)); mask-image: linear-gradient(var(--ang), #000 calc(var(--p) * 1% - 14%), transparent calc(var(--p) * 1%)); animation: wipe 2.2s cubic-bezier(.3,.6,.2,1) var(--d, .2s) forwards, float 8s ease-in-out calc(var(--d, .2s) + 2.2s) infinite; }
.pic.go.up .ill { --ang: 0deg; } .pic.go.rt .ill { --ang: 260deg; } .pic.go.dn .ill { --ang: 180deg; }
.pic.go.rad .ill { -webkit-mask-image: radial-gradient(circle at 50% 55%, #000 calc(var(--p) * 1% - 20%), transparent calc(var(--p) * 1%)); mask-image: radial-gradient(circle at 50% 55%, #000 calc(var(--p) * 1% - 20%), transparent calc(var(--p) * 1%)); }
@property --p { syntax: "<number>"; inherits: false; initial-value: 0; }
@keyframes wipe { from { --p: 0; } to { --p: 120; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.mosaic { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 20px; }
.mosaic figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.mosaic .pic .ill { max-height: 170px; }
.mosaic figcaption { font-size: .82rem; opacity: 0; animation: rise .6s ease forwards; animation-delay: var(--d); }
.i-btn { margin-top: 28px; min-height: 52px; padding: 12px 30px; border-radius: 4px; border: 1px solid var(--intro-fg); background: var(--intro-fg); color: var(--intro-bg); font-weight: 600; font-size: 1.05rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; opacity: 0; animation: rise .7s ease forwards; animation-delay: var(--d, .9s); }
.i-btn.ghost { background: transparent; color: var(--intro-fg); margin-left: 10px; }
.i-nav { max-width: 1000px; width: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px max(18px, env(safe-area-inset-bottom, 0px)); }
.dots { display: flex; gap: 8px; }
.dot { width: 28px; height: 3px; background: var(--intro-fg); opacity: .25; border: 0; padding: 0; cursor: pointer; }
.dot.on { opacity: 1; }
.i-go { display: flex; gap: 8px; }
.i-go button { min-height: 44px; padding: 8px 22px; border-radius: 4px; border: 1px solid var(--intro-fg); background: transparent; color: var(--intro-fg); cursor: pointer; font-weight: 500; }
.i-go button.pri { background: var(--intro-fg); color: var(--intro-bg); font-weight: 600; }
.i-go button[disabled] { opacity: .3; cursor: default; }
#intro :focus-visible { outline-color: var(--intro-fg); }
.drawn path, .drawn rect, .drawn circle { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease forwards; animation-delay: var(--d); }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: -0.02em; text-decoration: none; font-size: 1.1rem; }
.nav { display: flex; gap: 4px 18px; flex-wrap: wrap; align-items: center; }
.nav a { text-decoration: none; color: var(--muted); padding: 6px 0; border-bottom: 2px solid transparent; font-size: .95rem; }
.nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); }
.nav a.cta { color: var(--bg); background: var(--fg); padding: 6px 14px; border-radius: 4px; border: 0; font-weight: 600; }

/* shared */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 8px 18px; border-radius: 4px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--fg); }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: .9rem; }
.btn.danger { border-color: var(--warn); color: var(--warn); background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--muted); }
.banner { margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); background: var(--soft); font-size: .9rem; color: var(--muted); }
.banner.dark { background: var(--fg); color: var(--bg); border-color: var(--fg); display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.banner.dark .btn { background: var(--bg); color: var(--fg); border-color: var(--bg); }
.page-h { padding-block: 36px 8px; }
.page-h h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 600; letter-spacing: -0.03em; }
.page-h p { margin-top: 8px; color: var(--muted); max-width: 56ch; }
.sec-h { margin-top: 40px; padding-bottom: 8px; border-bottom: 1px solid var(--fg); font-size: .78rem; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .09em; font-weight: 500; display: flex; justify-content: space-between; gap: 12px; }
.empty { padding: 36px 0; color: var(--muted); }
.empty b { color: var(--fg); display: block; margin-bottom: 4px; font-size: 1.05rem; }
.ico { color: var(--fg); display: inline-flex; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 36px; padding: 3px 14px; border-radius: 4px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: .92rem; }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.panel { grid-column: 1 / -1; border: 1px solid var(--fg); padding: 16px; display: grid; gap: 12px; background: var(--bg); }
.panel p { font-size: .92rem; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--fg); flex: none; }
.tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: .75rem; border: 1px solid var(--line); padding: 1px 8px; border-radius: 3px; color: var(--muted); }
.tag.get { color: var(--fg); border-color: var(--fg); }
.note { font-size: .85rem; color: var(--muted); }
.err { color: var(--warn); font-size: .9rem; min-height: 1.3em; }

/* entry (register) */
.entry { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: center; padding-block: 48px 24px; }
.entry h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 600; letter-spacing: -.04em; line-height: 1.02; }
.entry .lead { margin-top: 10px; color: var(--muted); max-width: 40ch; }
.choose { margin-top: 26px; display: grid; gap: 10px; max-width: 440px; }
.choice { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-decoration: none; padding: 16px 18px; border: 1px solid var(--fg); border-radius: 4px; transition: background .15s ease, color .15s ease; }
.choice:hover { background: var(--fg); color: var(--bg); }
.choice b { font-size: 1.1rem; letter-spacing: -.01em; }
.choice span { grid-column: 1; color: var(--muted); font-size: .9rem; }
.choice:hover span { color: inherit; opacity: .8; }
.choice i { grid-column: 2; grid-row: 1 / span 2; font-style: normal; font-size: 1.3rem; }
.entry .small { margin-top: 16px; font-size: .85rem; color: var(--muted); max-width: 44ch; }
.entry .art { min-width: 0; }
.art-lite {  }

/* wizard and forms */
.prog { display: flex; align-items: center; gap: 6px; padding-top: 28px; }
.pdot { flex: 1; height: 3px; background: var(--line); max-width: 56px; }
.pdot.on { background: var(--fg); }
.prog .mono { margin-left: 10px; font-size: .8rem; color: var(--muted); }
.wz h2 { margin-top: 18px; font-size: clamp(1.6rem, 4.6vw, 2.2rem); letter-spacing: -.03em; font-weight: 600; }
.wz .hint { margin-top: 6px; color: var(--muted); max-width: 56ch; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 20px; max-width: 720px; }
.form .full { grid-column: 1 / -1; }
.form label { display: flex; flex-direction: column; gap: 5px; font-size: .88rem; font-weight: 500; }
.form small { font-weight: 400; color: var(--muted); }
.form input:not([type="checkbox"]), .form select, .form textarea { min-height: 44px; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); width: 100%; }
.form textarea { min-height: 96px; resize: vertical; }
.form legend { font-size: .88rem; font-weight: 500; padding: 0; margin-bottom: 6px; }
.form fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.sum { display: grid; gap: 0; border-top: 1px solid var(--fg); }
.sum div { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.sum dt, .sum span:first-child { color: var(--muted); }
.sum span { overflow-wrap: anywhere; }

/* hero and rows */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: center; padding-block: 32px 20px; }
.hero h1 { font-size: clamp(2.3rem, 7vw, 3.8rem); font-weight: 600; letter-spacing: -0.04em; line-height: 1; max-width: 11ch; }
.hero p { margin-top: 16px; color: var(--muted); max-width: 44ch; }
.hero .art svg { width: 100%; height: auto; color: var(--fg); }
.figs { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px 32px; }
.figs div { display: flex; flex-direction: column; }
.figs b { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 500; letter-spacing: -.02em; }
.figs span { font-size: .8rem; color: var(--muted); }
.filters { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 14px; border-top: 1px solid var(--line); }
.q { flex: 1 1 220px; max-width: 340px; min-height: 40px; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); }
.day { margin-top: 26px; font-family: var(--font-mono); font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--fg); }
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 8px 16px; padding-block: 18px; border-bottom: 1px solid var(--line); align-items: start; }
.row .when { font-size: .82rem; color: var(--muted); }
.row h3 { font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.row .sub { font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
.row .desc { margin-top: 6px; font-size: .94rem; max-width: 60ch; overflow-wrap: anywhere; }
.act { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.spots { font-size: .82rem; color: var(--muted); }
.spots.low { color: var(--warn); }
.st { font-family: var(--font-mono); font-size: .8rem; }
.st.ok { color: var(--ok); } .st.bad { color: var(--warn); }

/* profile */
.id-row { display: flex; gap: 20px; align-items: center; padding-block: 28px 8px; flex-wrap: wrap; }
.id-row .ico { border: 1px solid var(--fg); padding: 10px; }
.id-row h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 600; letter-spacing: -.03em; overflow-wrap: anywhere; }
.id-row p { color: var(--muted); font-size: .94rem; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--fg); border-bottom: 1px solid var(--line); margin-top: 20px; }
.stats div { padding: 16px 16px 16px 0; display: flex; flex-direction: column; }
.stats b { font-family: var(--font-mono); font-size: 2.2rem; font-weight: 500; letter-spacing: -.03em; line-height: 1.1; }
.stats span { font-size: .82rem; color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0; margin-top: 4px; }
.badge { padding: 18px 12px 18px 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; border-bottom: 1px solid var(--line); }
.badge svg { width: 64px; height: 64px; }
.badge b { font-size: .95rem; line-height: 1.2; }
.badge span { font-size: .78rem; color: var(--muted); }
.badge.off { opacity: .45; }
.badge.off .ring { stroke-dasharray: 4 4; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 600px; font-size: .92rem; }
th { text-align: left; font-family: var(--font-mono); font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); }
td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.cert-wrap { margin-top: 16px; border: 1px solid var(--fg); padding: 16px; display: grid; gap: 12px; }
.cert-paper { background: #ffffff; color: #0a0a0a; line-height: 0; }
.cert-paper svg { width: 100%; height: auto; display: block; }
.cardlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); border-top: 1px solid var(--fg); }
.org { padding: 20px 20px 20px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.org h3 { font-size: 1.1rem; overflow-wrap: anywhere; }
.org p { font-size: .92rem; color: var(--muted); overflow-wrap: anywhere; }
.org .m { font-size: .8rem; color: var(--muted); }

/* organiser desk */
.block { border-bottom: 1px solid var(--line); padding-block: 20px; display: grid; gap: 12px; }
.block header { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.block h3 { font-size: 1.1rem; overflow-wrap: anywhere; }
.sub-h { font-family: var(--font-mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 6px; }
.vol { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.vol .n { overflow-wrap: anywhere; }
.vol .n small { display: block; color: var(--muted); }
.vol input[type="number"] { width: 64px; min-height: 36px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); }
.vctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.vcard { grid-column: 1 / -1; font-size: .88rem; }
.vcard summary { cursor: pointer; color: var(--muted); }
.vcard dl { margin: 8px 0 0; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 12px; }
.vcard dt { color: var(--muted); } .vcard dd { margin: 0; overflow-wrap: anywhere; }
/* location picker */
.loc { grid-column: 1 / -1; display: grid; gap: 12px; }
.loc .pinrow { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 12px; align-items: end; }
.loc .verdict { font-size: .92rem; min-height: 1.4em; padding-bottom: 12px; }
.loc .verdict.ok { color: var(--ok); } .loc .verdict.bad { color: var(--warn); }
.results { display: grid; border: 1px solid var(--line); max-height: 220px; overflow-y: auto; }
.results button { text-align: left; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line); background: var(--bg); cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.results button:last-child { border-bottom: 0; }
.results button:hover, .results button:focus-visible { background: var(--soft); }
.results small { color: var(--muted); font-weight: 400; }
.picked { display: flex; justify-content: space-between; gap: 12px; align-items: center; border: 1px solid var(--fg); padding: 10px 12px; flex-wrap: wrap; }

/* stories */
.story { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 20px; padding-block: 24px; border-bottom: 1px solid var(--line); }
.story .pic .ill { max-height: 150px; }
.story .wk { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.story h2 { margin-top: 4px; font-size: 1.4rem; letter-spacing: -.02em; font-weight: 600; overflow-wrap: anywhere; }
.story .who { color: var(--muted); font-size: .92rem; margin-top: 2px; }
.story p.body { margin-top: 10px; max-width: 62ch; overflow-wrap: anywhere; }
.story p.body + p.body { margin-top: 8px; }
.week-card { margin-top: 20px; border: 1px solid var(--fg); display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; padding: 16px 18px; align-items: center; text-decoration: none; }
.week-card .pic .ill { max-height: 110px;  }
.week-card h3 { font-size: 1.15rem; letter-spacing: -.01em; margin-top: 2px; overflow-wrap: anywhere; }
.week-card p { color: var(--muted); font-size: .92rem; margin-top: 4px; }
.week-card .wk { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.admin-note { margin-top: 10px; font-size: .85rem; color: var(--muted); }

.foot { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 4px; font-size: .9rem; z-index: 120; max-width: calc(100vw - 32px); }

@media (max-width: 680px) {
  .sc, .hero, .opts { grid-template-columns: 1fr; }
  .sc .art, .hero .art { order: -1; max-width: 300px; }
  .form { grid-template-columns: 1fr; }
  .row { grid-template-columns: 40px minmax(0, 1fr); }
  .act { grid-column: 2; flex-direction: row; align-items: center; justify-content: space-between; }
  .sum div { grid-template-columns: 1fr; gap: 2px; }
  .entry { grid-template-columns: 1fr; gap: 20px; padding-top: 28px; }
  .entry .art { order: -1; max-width: 300px; }
  .loc .pinrow { grid-template-columns: 1fr; }
  .story, .week-card { grid-template-columns: 1fr; }
  .story .pic .ill, .week-card .pic .ill { max-height: 120px; width: auto; }
  .vcard dl { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .sc .kick, .sc h1, .sc .lead, .sc li, .i-btn { animation: none; opacity: 1; clip-path: none; }
  .drawn path, .drawn rect, .drawn circle { animation: none; stroke-dashoffset: 0; }
  .pic.gocard .ill { animation: none; -webkit-mask-image: none; mask-image: none; }
  #intro { transition: none; }
}

/* ===== v7 skin: bold, playful, sticker-like. Same app, new look. ===== */
:root {
  --font-display: "Bricolage Grotesque", "Geist", system-ui, sans-serif;
  --font-body: "Figtree", "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg: #fff3d9; --card: #fffdf6; --fg: #1c1612; --muted: #5e5446; --line: #e5d3a8; --soft: #ffe8b8; --sh: #1c1612;
  --accent: #ff5a36; --c2: #ffc21a; --c3: #3fcf8e; --c4: #4aa3ff; --c5: #ff7fae;
  --t1: color-mix(in srgb, var(--c2) 70%, var(--card)); --t2: color-mix(in srgb, var(--c3) 55%, var(--card)); --t3: color-mix(in srgb, var(--c4) 45%, var(--card));
  --t4: color-mix(in srgb, var(--accent) 38%, var(--card)); --t5: color-mix(in srgb, var(--c5) 45%, var(--card));
  --r: 22px; --bd: 2.5px solid var(--fg);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --accent: #ff6a45; --c2: #ffc21a; --c3: #3fcf8e; --c4: #5aa9ff; --c5: #ff86b4;
  --t1: color-mix(in srgb, var(--c2) 30%, var(--card)); --t2: color-mix(in srgb, var(--c3) 26%, var(--card)); --t3: color-mix(in srgb, var(--c4) 28%, var(--card)); --t4: color-mix(in srgb, var(--accent) 30%, var(--card)); --t5: color-mix(in srgb, var(--c5) 28%, var(--card)); } }
:root[data-theme="dark"] {
  --bg: #17120e; --card: #231c15; --fg: #fff3d9; --muted: #b9ab93; --line: #3a3024; --soft: #2d241b; --sh: #000;
  --accent: #ff6a45; --c2: #ffc21a; --c3: #3fcf8e; --c4: #5aa9ff; --c5: #ff86b4;
  --t1: color-mix(in srgb, var(--c2) 30%, var(--card)); --t2: color-mix(in srgb, var(--c3) 26%, var(--card)); --t3: color-mix(in srgb, var(--c4) 28%, var(--card)); --t4: color-mix(in srgb, var(--accent) 30%, var(--card)); --t5: color-mix(in srgb, var(--c5) 28%, var(--card)); }
body { font-family: var(--font-body); font-size: 16.5px; padding-bottom: 40px; }
h1, h2, h3, .brand, .i-mark, .stats b, .figs b, .choice b { font-family: var(--font-display); }
h1, h2 { font-weight: 800; letter-spacing: -.035em; }
h3 { font-weight: 700; }
.mono, .day, .sec-h, th { font-family: var(--font-body); font-weight: 700; letter-spacing: .04em; }
/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: var(--bd); padding-block: 12px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: inline-flex; align-items: center; gap: 10px; font-size: 1.35rem; font-weight: 800; letter-spacing: -.04em; }
.brand::before { content: ""; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); border: var(--bd); box-shadow: 3px 3px 0 var(--c2); }
.nav { gap: 6px; }
.nav a { padding: 7px 14px; border: 2px solid transparent; border-radius: 999px; color: var(--fg); font-weight: 700; font-size: .95rem; }
.nav a:hover { background: var(--soft); }
.nav a[aria-current="page"] { background: var(--c2); border-color: var(--fg); color: #1c1612; }
.nav a.cta { background: var(--accent); color: #1c1612; border: 2px solid var(--fg); box-shadow: 3px 3px 0 var(--sh); }
.nav a.me-chip { padding: 3px 12px 3px 3px; border-color: var(--fg); background: var(--card); }
.nav a.me-chip[aria-current="page"] .av { background: var(--fg); color: var(--bg); }
.av { border: 2px solid var(--fg); background: var(--c5); color: #1c1612; }
/* buttons, chips, inputs */
.btn { border-radius: 999px; border: var(--bd); background: var(--accent); color: #1c1612; font-weight: 800; padding: 8px 22px; min-height: 48px; box-shadow: 4px 4px 0 var(--sh); transition: transform .12s, box-shadow .12s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--sh); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--sh); }
.btn.ghost { background: var(--card); color: var(--fg); }
.btn.sm { min-height: 38px; padding: 4px 16px; font-size: .9rem; box-shadow: 3px 3px 0 var(--sh); }
.btn.danger { background: var(--card); color: var(--warn); border-color: var(--warn); box-shadow: 3px 3px 0 var(--warn); }
.btn[disabled] { box-shadow: none; }
.chip { border: 2px solid var(--fg); border-radius: 999px; background: var(--card); font-weight: 600; min-height: 40px; padding: 4px 16px; }
.chip:hover { background: var(--soft); }
.chip[aria-pressed="true"] { background: var(--c2); color: #1c1612; border-color: var(--fg); box-shadow: 2px 2px 0 var(--sh); }
.form input:not([type="checkbox"]), .form select, .form textarea, .q, .vol input[type="number"] { border: 2px solid var(--fg); border-radius: 14px; background: var(--card); min-height: 48px; padding: 8px 14px; }
.form input:focus, .form select:focus, .form textarea:focus, .q:focus { outline: 3px solid var(--c4); outline-offset: 1px; }
.q { border-radius: 999px; }
.check input { accent-color: var(--accent); }
.tag { border: 2px solid var(--fg); border-radius: 999px; padding: 1px 10px; color: var(--fg); font-weight: 600; font-size: .76rem; background: var(--card); }
.tag.get { background: var(--c2); color: #1c1612; }
.st { font-family: var(--font-body); font-weight: 800; }
/* cards */
.gocard, .cat, .tpl, .org, .block, .story, .week-card, .card, .cert-wrap, .next, .panel, .picked, .results, .banner, .row, .id-row + .btns { }
.gocard, .cat, .tpl, .org, .block, .story, .week-card, .card, .cert-wrap, .next, .panel, .row { border: var(--bd); border-radius: var(--r); background: var(--card); box-shadow: 5px 5px 0 var(--sh); }
.banner { border: 2px dashed var(--fg); border-radius: 16px; background: var(--card); color: var(--fg); }
.banner.dark { background: var(--fg); color: var(--bg); border: 2px solid var(--fg); }
.picked, .results { border: 2px solid var(--fg); border-radius: 14px; }
.empty { border: 2px dashed var(--fg); border-radius: var(--r); padding: 28px; margin-top: 16px; text-align: center; background: var(--card); }
.cardlist { border: 0; gap: 18px; padding: 4px 6px 6px 0; }
.org { padding: 18px; }
.block { padding: 18px; margin-top: 16px; }
.story { margin-top: 18px; padding: 18px; border-bottom: var(--bd); }
.week-card { box-shadow: 5px 5px 0 var(--sh); background: var(--t2); color: var(--fg); }
.week-card p { color: var(--fg); opacity: .8; }
.story .wk, .week-card .wk { color: var(--fg); background: var(--c2); display: inline-block; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--fg); font-family: var(--font-body); font-weight: 800; }
.card { margin-top: 22px; }
.page-h { padding-block: 28px 6px; } .page-h h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 800; }
.sec-h { margin-top: 36px; padding: 0 0 10px; border: 0; font-size: 1rem; text-transform: none; letter-spacing: -.01em; font-family: var(--font-display); font-weight: 800; align-items: center; }
.sec-h span:first-child { font-size: 1.5rem; letter-spacing: -.03em; }
.sec-h span:last-child, .sec-h a { background: var(--fg); color: var(--bg); border-radius: 999px; padding: 2px 12px; font-size: .8rem; font-family: var(--font-body); text-decoration: none; font-weight: 700; }
.day { display: inline-block; margin-top: 28px; padding: 4px 14px; background: var(--fg); color: var(--bg); border: 0; border-radius: 999px; font-size: .78rem; }
/* shift rows as cards */
.row { grid-template-columns: 60px minmax(0, 1fr) auto; padding: 16px; margin-top: 14px; border-bottom: var(--bd); align-items: start; }
.row .ico { width: 56px; height: 56px; border-radius: 18px; border: 2px solid var(--fg); background: var(--cc, var(--t1)); align-items: center; justify-content: center; color: #1c1612; }
.row .ico svg { width: 34px; height: 34px; }
.row h3 { font-size: 1.25rem; letter-spacing: -.02em; }
.row .when { font-weight: 800; color: var(--fg); font-size: .8rem; }
.row.c-Environment { --cc: var(--t2); } .row.c-Food { --cc: var(--t1); } .row.c-Elders { --cc: var(--t5); } .row.c-Children { --cc: var(--t3); } .row.c-Health { --cc: var(--t4); } .row.c-Safety { --cc: var(--t3); }
.spots { background: var(--soft); border: 2px solid var(--fg); border-radius: 999px; padding: 1px 10px; font-weight: 800; color: var(--fg); }
.spots.low { background: var(--accent); color: #1c1612; }
/* hero, dashboard */
.hero { background: var(--c2); border: var(--bd); border-radius: 30px; padding: 28px; margin-top: 22px; box-shadow: 6px 6px 0 var(--sh); color: #1c1612; position: relative; overflow: hidden; }
.hero h1 { font-size: clamp(2.5rem, 8vw, 4.6rem); line-height: .95; max-width: 9ch; }
.hero p { color: #1c1612; opacity: .85; }
.figs b, .stats b { font-family: var(--font-display); font-weight: 800; }
.hero .figs > div { background: var(--card); border: 2px solid #1c1612; border-radius: 16px; padding: 6px 14px; color: #1c1612; }
.hero .figs span { color: #1c1612; font-size: .78rem; font-weight: 700; }

.hero .ill { --paper: var(--c2); }
.stats { border: 0; gap: 12px; margin-top: 22px; }
.stats div { border: var(--bd); border-radius: 18px; padding: 14px 16px; background: var(--t1); box-shadow: 4px 4px 0 var(--sh); }
.stats div:nth-child(2) { background: var(--t2); } .stats div:nth-child(3) { background: var(--t5); }
.stats b { font-size: 2.6rem; letter-spacing: -.04em; } .stats span { color: var(--fg); font-weight: 700; }
.dash-h h1, .wel h1, .entry h1 { font-weight: 800; font-size: clamp(2.3rem, 7vw, 4rem); line-height: .98; }
.dash-h .stats { gap: 10px; } .dash-h .stats > div { border: var(--bd) !important; padding: 8px 14px !important; } .dash-h .stats b { color: var(--fg); font-size: 1.8rem; }
.gocard { padding: 20px; gap: 12px; } .gocard h2 { font-size: 1.8rem; }
.gocard:nth-child(1) { background: var(--c2); color: #1c1612; } .gocard:nth-child(2) { background: var(--c3); color: #1c1612; }
.gocard p { color: #1c1612; opacity: .85; }
.gocard:nth-child(1) .ill { --paper: var(--c2); } .gocard:nth-child(2) .ill { --paper: var(--c3); }
